<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img" aria-label="BUSBOX">
  <!-- speed lines -->
  <g stroke="#0B2B66" stroke-width="12" stroke-linecap="round">
    <line x1="26" y1="62" x2="84" y2="62"/>
    <line x1="6" y1="84" x2="76" y2="84"/>
    <line x1="34" y1="106" x2="82" y2="106"/>
  </g>
  <!-- box -->
  <g stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round">
    <polygon points="95,50 155,22 217,50 157,78" fill="#FF9A1F"/>
    <polygon points="95,50 157,78 157,150 95,124" fill="#FF8A00"/>
    <polygon points="157,78 217,50 217,122 157,150" fill="#F07800"/>
  </g>
  <!-- tape -->
  <polyline points="126,36 186,64 186,94" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <!-- wheels -->
  <g fill="#0B2B66" stroke="#FFFFFF" stroke-width="5">
    <circle cx="114" cy="146" r="19"/>
    <circle cx="200" cy="146" r="19"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="114" cy="146" r="7"/>
    <circle cx="200" cy="146" r="7"/>
  </g>
</svg>
